class Road {
  constructor(dirs, closed, lift) {
    this.closed = closed;
    this.pts = dirs.map(d => d.clone().multiplyScalar(surfaceR(d) + lift));
    if (closed) this.pts.push(this.pts[0].clone());
    this.cum = [0];
    for (let i = 1; i < this.pts.length; i++) this.cum.push(this.cum[i - 1] + this.pts[i].distanceTo(this.pts[i - 1]));
    this.len = this.cum[this.cum.length - 1];
  }
  sample(s, pos, tan) {
    let lo = 0, hi = this.cum.length - 1;
    while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (this.cum[mid] <= s) lo = mid; else hi = mid; }
    const t = (s - this.cum[lo]) / ((this.cum[hi] - this.cum[lo]) || 1);
    pos.lerpVectors(this.pts[lo], this.pts[hi], t);
    tan.subVectors(this.pts[hi], this.pts[lo]).normalize();
  }
}
function ribbon(pts, hw, lift, keep) {
  const pos = [], nor = [], idx = [], n = pts.length, t = new V3(), up = new V3(), side = new V3(), p = new V3();
  for (let i = 0; i < n; i++) {
    t.subVectors(pts[Math.min(i + 1, n - 1)], pts[Math.max(i - 1, 0)]);
    up.copy(pts[i]).normalize();
    side.crossVectors(t, up).normalize().multiplyScalar(hw);
    p.copy(pts[i]).addScaledVector(up, lift);
    pos.push(p.x + side.x, p.y + side.y, p.z + side.z, p.x - side.x, p.y - side.y, p.z - side.z);
    nor.push(up.x, up.y, up.z, up.x, up.y, up.z);
  }
  for (let i = 0; i < n - 1; i++) if (!keep || keep(i)) { const a = 2 * i; idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  g.setIndex(idx);
  return g;
}

  sub: () => ({ o: subs[followIdx % subs.length], scale: 0.75, look: 0.04 }),
  fish: () => ({ o: allFish[followIdx % allFish.length], scale: 0.2, look: 0.02 }),
  bird: () => ({ o: allBirds[followIdx % allBirds.length], scale: 0.3, look: 0.02 }),
  person: () => ({ o: people[followIdx % people.length], scale: 0.26, look: 0.14 }),
  train: () => ({ o: train, scale: 0.9, look: 0.05 }),
};
const hint = document.getElementById('hint');
const underwater = document.getElementById('underwater');
const defaultHint = hint.textContent;
function setMode(m) {

  mode = m; driven = null;

document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
// number keys pick the mode buttons in order: 1–9, then 0 and -
const MODE_KEYS = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0', '-'];
const modeButtons = [...document.querySelectorAll('[data-mode]')];
modeButtons.forEach((b, i) => {

  const k = document.createElement('span'); k.className = 'key'; k.textContent = MODE_KEYS[i]; b.append(k);
  b.dataset.tip += ` (${MODE_KEYS[i]})`;
});
addEventListener('keydown', e => {
  if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
  const i = MODE_KEYS.indexOf(e.key);
  if (i >= 0 && modeButtons[i]) modeButtons[i].click();

let dayNight = true;
document.getElementById('daynight').addEventListener('click', e => { dayNight = !dayNight; e.currentTarget.classList.toggle('on', dayNight); });
document.getElementById('spin').addEventListener('click', e => { spinning = !spinning; e.currentTarget.classList.toggle('on', spinning); });
const muteBtn = document.getElementById('mute');
const showMute = () => { muteBtn.textContent = sfx.muted ? '🔇' : '🔊'; muteBtn.classList.toggle('on', !sfx.muted); };
showMute();
muteBtn.addEventListener('click', () => {
  sfx.muted = !sfx.muted;
  try { localStorage.setItem('planetpop-muted', sfx.muted ? '1' : '0'); } catch { /* not remembered */ }
  sfxInit();
  if (sfx.master) sfx.master.gain.setTargetAtTime(sfx.muted ? 0 : 0.8, audioCtx.currentTime, 0.05);
  showMute();
});
document.getElementById('erupt').addEventListener('click', () => {
  mode = 'volcano'; driven = null;
  document.querySelectorAll('[data-mode]').forEach(b => b.classList.remove('on'));
  controls.enabled = false; controls.autoRotate = false; flyOut = false;
  Object.assign(chase, { yaw: 0, pitch: VOLC_CAM_ELEV, dist: 1 }); // pitch = height angle, dist = zoom
  triggerEruption();
  hint.textContent = 'KABOOM! Drag to circle and climb · scroll to zoom out · 1 for orbit';
});

const el = renderer.domElement;
let dragging = false, lx = 0, ly = 0;
el.addEventListener('pointerdown', e => { if (mode === 'orbit') return; dragging = true; lx = e.clientX; ly = e.clientY; el.setPointerCapture(e.pointerId); });
el.addEventListener('pointermove', e => {
  if (!dragging) return;
  chase.yaw -= (e.clientX - lx) * 0.006;
  chase.pitch = clamp(chase.pitch + (e.clientY - ly) * 0.005, -0.2, 1.45);
  lx = e.clientX; ly = e.clientY;
});
el.addEventListener('pointerup', () => dragging = false);
el.addEventListener('wheel', e => { if (mode !== 'orbit') chase.dist = clamp(chase.dist * Math.exp(e.deltaY * 0.001), 0.35, 6); }, { passive: true });

const _ct = new V3(), _cb = new V3(), _cr = new V3(), _look = new V3(), _dir = new V3();
const _wpos = new V3(), _wfwd = new V3(), _wup = new V3(), _wcu = new V3(), _wqInv = new THREE.Quaternion();
// glide the camera toward a world-space target; if it's round the other side of the planet,
// swing over the top at a safe height rather than cutting straight through
const _mc = new V3(), _mt = new V3();
function moveCameraTo(target, k) {
  _mc.copy(camera.position).normalize(); _mt.copy(target).normalize();
  if (_mc.dot(_mt) < 0.97 && target.length() < 40) {

}
// last line of defence, every frame: keep the camera above the rendered ground (and the sea, unless

function keepCameraOutside() {

  const r = _mc.length(); _mc.divideScalar(r);

  floor += 0.03;

}
function updateCamera(dt) {
  _wqInv.copy(world.quaternion).invert();
  camera.fov = lerp(camera.fov, mode === 'volcano' ? 58 : 45, 1 - Math.exp(-dt * 3)); // a wider lens for the eruption
  if (mode === 'volcano') {

    // It keeps whatever angle you choose and glides there smoothly.
    const d = VOLC_CAM_DIST * chase.dist, el = clamp(chase.pitch, 0.05, 1.45), az = VOLC.viewAz + chase.yaw;
    _look.copy(VOLC.dir).multiplyScalar(VOLC_TOP.length() + 0.3); // pivot just above the crater (planet-local)
    _cb.copy(VOLC.t1).multiplyScalar(Math.cos(az)).addScaledVector(VOLC.t2, Math.sin(az)); // level direction away from the volcano
    _ct.copy(_look).addScaledVector(_cb, d * Math.cos(el)).addScaledVector(VOLC.dir, d * Math.sin(el));

  } else if (mode === 'orbit') {
    const dist = camera.position.length();
    const ground = surfaceR(_dir.copy(camera.position).applyQuaternion(_wqInv).normalize());
    controls.minDistance = ground + 0.3;
    controls.rotateSpeed = clamp((dist - 10) / 12, 0.03, 0.9);
    controls.zoomSpeed = clamp((dist - 10) / 7, 0.12, 1.2);
    if (flyOut) {

    camera.near = clamp((dist - ground) * 0.05, 0.005, 0.5);
  } else {
    const { o, scale, look, camUp } = targets[mode]();
    if (driven === o && (keys.f || keys.b || keys.l || keys.r)) chase.yaw = lerp(chase.yaw, mode === 'plane' ? 0.3 : 0, 1 - Math.exp(-dt * 2));
    const wq = world.quaternion;
    _wpos.copy(o.pos).applyQuaternion(wq); _wfwd.copy(o.fwd).applyQuaternion(wq); _wup.copy(o.up).applyQuaternion(wq);
    _wcu.copy(camUp || o.up).applyQuaternion(wq);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.getDrawingBufferSize(U.uRes.value);
});

// ---------- going easy on the computer ----------
const _cd = new V3(), lastCull = { dir: new V3(), dist: 0 };

  const dirs = new Float32Array(n * 3), extra = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const x = mats[i * 16 + 12], y = mats[i * 16 + 13], z = mats[i * 16 + 14], l = Math.hypot(x, y, z) || 1;

function cullToHorizon() {

function applyQuality(level) {

  renderer.setSize(innerWidth, innerHeight);
  renderer.getDrawingBufferSize(U.uRes.value);
  U.uDot.value = 5 * renderer.getPixelRatio();

}
applyQuality(quality);
// Watch how fast frames actually arrive. If they're well below the frame cap for 4 seconds, step down a level;
// if they're comfortably on time for 20 seconds, try one level up again (but never above where we started).
const perf = { windowStart: 0, frames: 0, sum: 0, slow: 0, fast: 0, floor: quality };
function watchPerformance(now, interval) {
  if (interval > 250) return; // a stall (tab switch, pause): ignore
  perf.frames++; perf.sum += interval;
  if (now - perf.windowStart < 2000) return;
  const avg = perf.sum / perf.frames, target = 1000 / QUALITY[quality].fps;

// Pause whenever the window isn't in focus (e.g. you've clicked over to Teams), so the game never competes with other apps.
let paused = false, lastFrameAt = 0;
const pausedEl = document.getElementById('paused');
function setPaused(p) {
  if (paused === p) return;
  paused = p; pausedEl.hidden = !p;
  if (audioCtx) { if (p) audioCtx.suspend(); else if (!sfx.muted) audioCtx.resume(); }
  if (!p) { clock.getDelta(); lastFrameAt = 0; } // don't count the paused time as one giant frame
}
addEventListener('blur', () => setPaused(true));
addEventListener('focus', () => setPaused(false));
pausedEl.addEventListener('click', () => setPaused(false));

// ---------- loop ----------
const clock = new THREE.Clock();
let time = 0, sunAngle = 0.6;
renderer.setAnimationLoop(now => {
  if (paused) return;
  // frame cap: 60 (or 30 at the lower levels), even on fast 120 Hz screens
  if (lastFrameAt && now - lastFrameAt < 1000 / QUALITY[quality].fps - 2) return;
  if (lastFrameAt) watchPerformance(now, now - lastFrameAt);
  lastFrameAt = now;
  const dt = Math.min(clock.getDelta(), 0.05); time += dt;
  U.uTime.value = time;
  if (dayNight) sunAngle += dt * TAU / 120;
  U.uLight.value.set(Math.cos(sunAngle), 0.35, Math.sin(sunAngle)).normalize();
  sun.position.copy(U.uLight.value).multiplyScalar(170);
  sun.userData.rays.forEach(r => r.rotation.z = time * 0.15);
  if (spinning) world.rotation.y += dt * TAU / 90;
  world.updateMatrixWorld();
  moonAngle += dt * MOON_W;
  moonAt(moonAngle, moon.position);
  moon.lookAt(0, 0, 0);
  moon.updateMatrixWorld();
  updateRocket(dt, time);
  updateSubs(dt, time); updateFish(dt, time);
  updatePeople(dt, time); updateVolcano(dt, time); updateKnocks(); updateTrain(dt, time); updateBirds(dt, time);
  updateCars(dt); updateBoats(dt, time); updateClouds(dt); updatePlanes(dt, time); updateBalloons(dt, time);

    const d = camera.position.distanceTo(_look.copy(VOLC_TOP).applyQuaternion(world.quaternion));
    const amp = 0.012 * clamp(1 - (d - 3) / 18, 0, 1) * Math.min(1, bigEruption / 2);
    camera.rotateX((Math.random() - 0.5) * amp); camera.rotateY((Math.random() - 0.5) * amp);
  }
  const under = camera.position.length() < R;
  for (const ink of oceanInks) ink.visible = !under;

  sun.lookAt(camera.position);
  renderer.render(scene, camera);
});
document.getElementById('loading').remove();
